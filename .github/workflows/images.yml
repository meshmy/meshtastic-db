name: images

# Builds every service image on relevant pull requests and publishes them to
# GHCR from main and version tags. The build context is the repo root, as in
# docker-compose.yml, because the service Dockerfiles copy services/common.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "services/**"
      - ".github/workflows/images.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - archive-job
          - gateway-agent
          - ingest-api
          - map-app
          - mqtt-ingest
          - tcp-poller
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/meshtastic-db-${{ matrix.service }}
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=tag

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
