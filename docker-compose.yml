services:
  timescaledb:
    image: timescale/timescaledb-ha:pg16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: meshtastic
      RAW_COMPRESS_AFTER: ${RAW_COMPRESS_AFTER}
      HOURLY_COMPRESS_AFTER: ${HOURLY_COMPRESS_AFTER}
      DAILY_COMPRESS_AFTER: ${DAILY_COMPRESS_AFTER}
      INGEST_DB_PASSWORD: ${INGEST_DB_PASSWORD}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
      ARCHIVE_DB_PASSWORD: ${ARCHIVE_DB_PASSWORD}
    volumes:
      - timescaledb_data:/home/postgres/pgdata/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"

  grafana:
    image: grafana/grafana:11.3.0-ubuntu
    restart: unless-stopped
    depends_on:
      - timescaledb
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"

  mqtt-ingest:
    build:
      context: .
      dockerfile: services/mqtt-ingest/Dockerfile
    restart: unless-stopped
    depends_on:
      - timescaledb
    environment:
      INGEST_DB_HOST: timescaledb
      INGEST_DB_PORT: 5432
      INGEST_DB_NAME: meshtastic
      INGEST_DB_PASSWORD: ${INGEST_DB_PASSWORD}
      MQTT_HOST: ${MQTT_HOST}
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD_FILE: /run/secrets/mqtt_password
      REGIONS_CONFIG_PATH: /config/regions.yaml
    volumes:
      - ./config/regions.yaml:/config/regions.yaml:ro
    secrets:
      - mqtt_password

  tcp-poller:
    build:
      context: .
      dockerfile: services/tcp-poller/Dockerfile
    restart: unless-stopped
    profiles: ["extra-sources"]
    depends_on:
      - timescaledb
    environment:
      INGEST_DB_HOST: timescaledb
      INGEST_DB_PORT: 5432
      INGEST_DB_NAME: meshtastic
      INGEST_DB_PASSWORD: ${INGEST_DB_PASSWORD}
      REGIONS_CONFIG_PATH: /config/regions.yaml
    volumes:
      - ./config/regions.yaml:/config/regions.yaml:ro

  ingest-api:
    build:
      context: .
      dockerfile: services/ingest-api/Dockerfile
    restart: unless-stopped
    profiles: ["extra-sources"]
    depends_on:
      - timescaledb
    environment:
      INGEST_DB_HOST: timescaledb
      INGEST_DB_PORT: 5432
      INGEST_DB_NAME: meshtastic
      INGEST_DB_PASSWORD: ${INGEST_DB_PASSWORD}
      REGIONS_CONFIG_PATH: /config/regions.yaml
      INGEST_API_TOKEN_FILE: /run/secrets/ingest_api_token
    volumes:
      - ./config/regions.yaml:/config/regions.yaml:ro
    ports:
      - "8000:8000"
    secrets:
      - ingest_api_token

  archive-job:
    build:
      context: .
      dockerfile: services/archive-job/Dockerfile
    restart: unless-stopped
    depends_on:
      - timescaledb
    environment:
      INGEST_DB_HOST: timescaledb
      INGEST_DB_PORT: 5432
      INGEST_DB_NAME: meshtastic
      ARCHIVE_DB_PASSWORD: ${ARCHIVE_DB_PASSWORD}
      RAW_RETENTION_INTERVAL: ${RAW_RETENTION_INTERVAL}
      ARCHIVE_SCHEDULE_CRON: ${ARCHIVE_SCHEDULE_CRON}
      ARCHIVE_BACKEND: ${ARCHIVE_BACKEND}
      ARCHIVE_LOCAL_PATH: /archive
      ARCHIVE_S3_BUCKET: ${ARCHIVE_S3_BUCKET}
      ARCHIVE_S3_ENDPOINT: ${ARCHIVE_S3_ENDPOINT}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    volumes:
      - ./archive:/archive

volumes:
  timescaledb_data:
  grafana_data:

secrets:
  mqtt_password:
    file: ./secrets/mqtt_password.txt
  ingest_api_token:
    file: ./secrets/ingest_api_token.txt
